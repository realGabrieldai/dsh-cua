name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # macOS 14+ is required: the capture path uses ScreenCaptureKit's
    # SCScreenshotManager, which does not exist on older SDKs.
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          node --version
          sw_vers

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Build (release)
        run: swift build -c release

      - name: Self-test (built-in assertion suite)
        # Deliberately not `swift test`: the package has no XCTest target so that it also
        # builds on Command Line Tools-only machines. These are the same assertions.
        run: ./.build/release/dsh-cua selftest --json

      - name: CLI help renders
        run: ./.build/release/dsh-cua --help

      - name: doctor never fails hard
        # No TCC permissions exist on CI; doctor must still exit 0 with a JSON envelope.
        run: ./.build/release/dsh-cua doctor --json

      - name: MCP server syntax
        run: node --check mcp/server.mjs

      - name: MCP protocol self-test
        run: node mcp/test-server.mjs
